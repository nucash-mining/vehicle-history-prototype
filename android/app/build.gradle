plugins { id 'com.android.application' }

android {
    namespace 'app.vintrace'
    compileSdk 35
    defaultConfig {
        applicationId 'app.vintrace'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
}

// Ship the same index.html that GitHub Pages serves
tasks.register('copyWeb', Copy) {
    from("$rootDir/..") {
        include 'index.html'
        include 'vendor/**'
    }
    into("$projectDir/src/main/assets")
}
preBuild.dependsOn copyWeb
